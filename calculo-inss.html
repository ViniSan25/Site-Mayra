<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de INSS de Obra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="calculo-page">

    <div class="calculo-box">

        <h1>Simulação de INSS de Obra</h1>

        <div class="campo">
            <label>Nome da Simulação</label>
            <input type="text" id="nomeSimulacao">
        </div>

        <div class="campo">
            <label>Responsável</label>
            <select id="responsavel">
                <option value="">Selecione</option>
                <option value="Pessoa Física">Pessoa Física</option>
                <option value="Pessoa Jurídica">Pessoa Jurídica</option>
            </select>
        </div>

        <div class="campo">
            <label>Destinação</label>
            <select id="destinacao">
                <option value="">Selecione</option>
                <option>Residencial Unifamiliar</option>
                <option>Residencial Multifamiliar</option>
                <option>Comercial</option>
                <option>Industrial</option>
                <option>Mista</option>
            </select>
        </div>

        <div class="campo">
            <label>Tipo da Obra</label>
            <select id="tipoObra">
                <option value="">Selecione</option>
                <option>Construção Nova</option>
                <option>Ampliação</option>
                <option>Reforma</option>
                <option>Regularização</option>
            </select>
        </div>

        <div class="campo">
            <label>Área Construída (m²)</label>
            <input type="number" id="areaConstruida">
        </div>

        <div class="campo">
            <label>Estado (UF)</label>
            <select id="uf">
                <option value="">Selecione</option>
                <option>AC</option>
                <option>AL</option>
                <option>AP</option>
                <option>AM</option>
                <option>BA</option>
                <option>CE</option>
                <option>DF</option>
                <option>ES</option>
                <option>GO</option>
                <option>MA</option>
                <option>MT</option>
                <option>MS</option>
                <option>MG</option>
                <option>PA</option>
                <option>PB</option>
                <option>PR</option>
                <option>PE</option>
                <option>PI</option>
                <option>RJ</option>
                <option>RN</option>
                <option>RS</option>
                <option>RO</option>
                <option>RR</option>
                <option>SC</option>
                <option>SP</option>
                <option>SE</option>
                <option>TO</option>
            </select>
        </div>

        <div class="campo">
            <label>Padrão da Obra</label>
            <select id="padrao">
                <option value="">Selecione</option>
                <option value="baixo">Baixo</option>
                <option value="normal">Normal</option>
                <option value="alto">Alto</option>
            </select>
        </div>

        <div class="campo">
            <label>Data de Início</label>
            <input type="date" id="dataInicio">
        </div>

        <div class="campo">
            <label>Data de Conclusão</label>
            <input type="date" id="dataFim">
        </div>

        <div class="campo">
            <label>Possui Notas Fiscais?</label>
            <select id="notas">
                <option value="">Selecione</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
        </div>

        <div class="campo">
            <label>Utilizou Concreto Usinado?</label>
            <select id="concreto">
                <option value="">Selecione</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
        </div>

        <button onclick="simularINSS()">
            Calcular INSS
        </button>

        <div id="resultado" class="resultado"></div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
